name: prova

on:
  push:
  pull_request:

jobs:
  prova:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o portao le a historia inteira (identidade dos commits)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Instalar ruff (linter que a prova da skill roda em si mesma)"
        run: python -m pip install --quiet ruff
      - name: "Testes puros das ferramentas do repo"
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: "Portao do repo (prova da skill + varredura de dados da maquina)"
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tools/prova_repo.py
